<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6757dc"><meta name="description" content="Annota 标序：音频、视频与图片的本地标注演示工作台。">
  <title>Annota 标序 · 多模态标注工作台</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <style>:root {
  color-scheme: light;
  --page: #f5f6fa;
  --surface: #fff;
  --ink: #232735;
  --muted: #6e7688;
  --accent: #6757dc;
  --accent_soft: #efecfb;
  --line: #e7e9ef;
  --canvas: #19202c;
  --success: #258c72;
  --danger: #c45363;
  --radius: 12px;
  --header: 64px;
  --footer: 30px;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--page);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, textarea, select { font: inherit; }
button, select, input[type="range"], input[type="checkbox"] { cursor: pointer; }
button { color: inherit; }
button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button { border: 0; background: transparent; }
button:disabled { opacity: .42; cursor: not-allowed; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, a, input, textarea, select { outline-offset: 3px; }
:focus-visible { outline: 3px solid #b8adff; }
button, .button, .task_card { transition: background .16s ease, border-color .16s ease, box-shadow .16s ease; }
svg { display: block; flex-shrink: 0; }
button svg, .button svg { width: 18px; height: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 23px; font-weight: 650; line-height: 1.4; letter-spacing: -.5px; }
h2 { font-size: 15px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
small { font-size: 12px; }
[hidden] { display: none !important; }
.muted, .subtitle { color: var(--muted); }
.mono, .time_readout, .segment_times, .timeline_ruler { font-family: Consolas, "SFMono-Regular", monospace; font-variant-numeric: tabular-nums; }
.app_header { height: var(--header); display: flex; align-items: center; border-bottom: 1px solid var(--line); background: var(--surface); padding-right: 24px; gap: 24px; }
.brand { width: 306px; padding: 0 22px; display: flex; align-items: center; gap: 11px; flex-shrink: 0; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand_mark { width: 32px; height: 34px; background: var(--accent); color: #fff; border-radius: 10px 10px 10px 3px; display: grid; place-items: center; font-weight: 700; font-size: 19px; }
.brand_text { font-size: 17px; font-weight: 750; letter-spacing: -.4px; white-space: nowrap; }
.brand_text small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 1.8px; line-height: 1.3; }
.version_tag { border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-family: Consolas, monospace; font-size: 10px; padding: 0 5px; }
.phase_tabs { display: flex; height: 100%; gap: 27px; align-items: stretch; }
.phase_tabs button { position: relative; color: var(--muted); font-size: 14px; font-weight: 600; padding: 0 1px; white-space: nowrap; }
.phase_tabs button.active { color: var(--accent); }
.phase_tabs button.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.header_actions { margin-left: auto; display: flex; align-items: center; gap: 13px; }
.save_indicator { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.save_indicator::before { content: ""; width: 5px; height: 5px; background: var(--success); border-radius: 50%; }
.avatar { height: 30px; width: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--accent_soft); font-size: 11px; font-weight: 700; }
.app_shell { display: grid; grid-template-columns: 70px 236px minmax(0, 1fr); height: calc(100dvh - var(--header) - var(--footer)); min-height: 0; }
.app_rail { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; padding: 21px 0 16px; gap: 14px; }
.rail_button { width: 44px; min-height: 47px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 9px; color: #757e91; font-size: 10px; }
.rail_button svg { width: 20px; height: 20px; }
.rail_button small { font-size: inherit; }
.rail_button.active { color: var(--accent); background: var(--accent_soft); }
.rail_button:hover { background: #f3f2f9; color: var(--accent); }
.rail_spacer { flex: 1; }
.rail_footer { color: #a0a5b0; font: 10px Consolas, monospace; }
.task_sidebar { display: flex; min-height: 0; flex-direction: column; border-right: 1px solid var(--line); background: #fcfcfe; padding: 23px 15px 0; }
.sidebar_heading { display: flex; justify-content: space-between; align-items: center; padding: 0 5px 18px; }
.sidebar_heading h2 { font-size: 16px; }
.sidebar_heading small { color: var(--muted); font-size: 11px; letter-spacing: .5px; }
.modality_switch { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 8px; background: #eeeff4; gap: 3px; margin-bottom: 17px; }
.modality_switch button { border-radius: 6px; padding: 6px 4px; color: #70798b; font-size: 13px; }
.modality_switch button.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 4px #25213f0d; font-weight: 650; }
.search_field { position: relative; margin-bottom: 11px; }
.search_field > span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #a0a4b2; }
.search_field svg { width: 13px; height: 13px; }
.search_field input { width: 100%; background: var(--surface); border: 1px solid var(--line); height: 36px; padding: 0 11px 0 31px; border-radius: 7px; font-size: 12px; color: var(--ink); }
.search_field input::placeholder { color: #a4a8b3; }
.task_filters { display: flex; align-items: center; gap: 8px; padding: 0 3px 13px; }
.task_filters > span { font-size: 11px; white-space: nowrap; color: #777f90; }
.task_filters select { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--muted); font-size: 12px; }
.task_list { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 2px 6px 18px; }
.task_card { display: flex; width: 100%; text-align: left; align-items: center; gap: 10px; padding: 13px 10px; margin-bottom: 8px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; background: transparent; }
.task_card:hover { background: #f2f1f9; }
.task_card.active { border-color: #d8d0f8; background: var(--accent_soft); box-shadow: 0 3px 9px #51428905; }
.task_thumb { height: 43px; width: 43px; border-radius: 8px; background: #e9e8f2; color: #8f84ca; display: grid; place-items: center; overflow: hidden; flex-shrink: 0; }
.task_thumb svg { width: 21px; height: 21px; }
.task_thumb img { width: 100%; height: 100%; object-fit: cover; }
.task_summary { flex: 1; min-width: 0; }
.task_summary strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; font-weight: 650; overflow: hidden; line-height: 1.7; overflow-wrap: anywhere; }
.task_summary span { display: block; color: #77768d; font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status_dot { height: 6px; width: 6px; flex-shrink: 0; border-radius: 50%; background: #babfcb; }
.status_draft { background: #a9a5bc; }
.status_submitted, .status_review { background: #e3aa53; }
.status_pending { background: #e3aa53; }
.badge.status_pending { color: #9b6c20; background: #fff7e6; border-color: #f1dfb6; }
.badge.status_approved { color: #1e7a63; background: #edf7f3; border-color: #dcefe7; }
.badge.status_returned { color: #b4485c; background: #fcf0f2; border-color: #efd8de; }
.badge.status_draft { color: #7e738f; background: #f7f5fa; border-color: #e7e2ef; }
.status_approved, .status_accepted { background: var(--success); }
.status_returned, .status_rejected { background: var(--danger); }
.queue_footer { border-top: 1px solid var(--line); padding: 13px 4px; font-size: 10px; color: var(--muted); }
.queue_footer button { width: 100%; }
.queue_footer small { display: block; margin-top: 9px; text-align: center; font-size: 11px; color: #7e8698; }
.workspace { min-width: 0; min-height: 0; overflow-y: auto; padding: 25px 26px 27px; }
.workspace_heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 22px; }
.eyebrow { color: #777f93; font: 11px Consolas, monospace; letter-spacing: 1.1px; margin-bottom: 7px; text-transform: uppercase; }
.subtitle { font-size: 12px; margin-top: 7px; }
.heading_actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.workbench_grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.media_column { min-width: 0; }
.media_panel, .timeline_panel, .segment_section, .inspector, .review_card, .eval_card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.media_panel { overflow: hidden; position: sticky; top: 0; z-index: 2; }
.media_toolbar { min-height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 7px 13px; border-bottom: 1px solid var(--line); gap: 8px; }
.tool_group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.icon_button { height: 30px; min-width: 30px; padding: 5px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; color: #8990a1; font-size: 11px; }
.icon_button:hover { color: var(--accent); background: #f5f3fc; }
.icon_button.active { color: var(--accent); background: var(--accent_soft); }
.toolbar_label { color: var(--muted); font-size: 11px; white-space: nowrap; }
.media_stage { background: var(--canvas); color: #e3e6ee; }
.audio_stage { min-height: 160px; padding: 26px 30px; position: relative; display: flex; align-items: center; justify-content: center; }
.audio_identity { display: flex; align-items: center; gap: 20px; max-width: 100%; }
.audio_identity h2 { font-size: 17px; font-weight: 550; color: #f1f2f8; }
.audio_identity p { font-size: 12px; color: #afb7ca; margin-top: 7px; }
.audio_orb { height: 65px; width: 65px; border: 1px solid #4a4668; background: #292940; border-radius: 18px; color: #b4a6ff; display: grid; place-items: center; flex-shrink: 0; }
.audio_orb svg { width: 32px; height: 32px; }
.wave_summary { color: #aaa3d1; font: 11px Consolas, monospace; letter-spacing: 1px; }
.visual_viewport { height: clamp(220px, 36vh, 420px); min-width: 0; background: var(--canvas); display: flex; align-items: center; justify-content: center; overflow: auto; padding: 16px; }
.visual_surface { display: inline-flex; position: relative; max-width: 100%; max-height: 100%; line-height: 0; flex-shrink: 0; }
.visual_surface img, .visual_surface video { display: block; max-width: 100%; max-height: min(36vh - 32px, 388px); width: auto; height: auto; object-fit: contain; }
.annotation_overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; user-select: none; }
.annotation_overlay rect { vector-effect: non-scaling-stroke; }
.transport { min-height: 52px; display: flex; align-items: center; gap: 13px; padding: 10px 17px; background: var(--surface); }
.play_button { width: 29px; height: 29px; display: grid; place-items: center; background: var(--accent); border-radius: 50%; color: #fff; flex-shrink: 0; }
.play_button svg { width: 13px; height: 13px; }
.time_readout { white-space: nowrap; font-size: 11px; color: #697187; }
.seek_slider { width: 100%; min-width: 35px; accent-color: var(--accent); height: 3px; }
.speed_select { border: 0; background: #f5f5f9; border-radius: 5px; padding: 3px; color: #697185; font-size: 11px; max-width: 62px; }
.timeline_panel { overflow: hidden; margin-top: 16px; padding: 14px 17px 12px; }
.timeline_header, .section_heading { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
.timeline_header h3 { font-size: 13px; }
.timeline_header small, .section_heading small { font-size: 11px; color: var(--muted); }
.timeline_canvas { display: block; width: 100%; height: 120px; margin-top: 9px; touch-action: none; cursor: crosshair; }
.timeline_ruler { display: flex; justify-content: space-between; color: #7e8799; font-size: 10px; margin-bottom: 7px; }
.segment_lane { display: flex; min-height: 27px; gap: 4px; flex-wrap: wrap; }
.segment_chip { border: 1px solid #ded7f5; background: #f7f5fd; padding: 4px 10px; border-radius: 5px; color: #776aab; font-size: 11px; }
.segment_chip.active { border-color: #aa9ae8; color: var(--accent); background: var(--accent_soft); }
.segment_section { margin-top: 16px; overflow: hidden; }
.section_heading { padding: 15px 17px; border-bottom: 1px solid var(--line); }
.section_heading h2 { font-size: 14px; }
.segment_list { padding: 4px 0; }
.segment_row { padding: 13px 16px; display: grid; grid-template-columns: 23px minmax(0, 1fr) auto; gap: 0 9px; text-align: left; width: 100%; border-left: 3px solid transparent; cursor: pointer; }
.segment_row + .segment_row { border-top: 1px solid #f0f1f5; }
.segment_row:hover { background: #faf9fe; }
.segment_row.active { background: #f6f4fd; border-left-color: var(--accent); }
.segment_index { grid-row: span 2; color: #8c7fb8; padding-top: 1px; font: 11px Consolas, monospace; }
.segment_times { color: #7c729b; font-size: 11px; }
.segment_text { grid-column: 2; font-size: 14px; color: #43475b; margin-top: 5px; overflow-wrap: anywhere; line-height: 1.85; }
.row_actions { grid-column: 3; grid-row: 1 / span 2; display: flex; align-items: center; }
.row_actions button { padding: 3px; color: #a6a1b7; }
.workflow_hint { margin-top: 15px; display: flex; align-items: flex-start; gap: 8px; color: #768096; font-size: 11px; line-height: 1.8; }
.inspector { position: sticky; top: 0; overflow: hidden; min-width: 0; display: flex; flex-direction: column; max-height: calc(100dvh - 225px); }
.inspector_heading { padding: 16px 18px 13px; display: flex; justify-content: space-between; align-items: center; }
.inspector_heading h2 { font-size: 14px; }
.inspector_tabs { display: flex; gap: 23px; border-bottom: 1px solid var(--line); padding: 0 18px; }
.inspector_tabs button { position: relative; padding: 0 0 11px; color: #788095; font-size: 12px; }
.inspector_tabs button.active { color: var(--accent); font-weight: 650; }
.inspector_tabs button.active::after { position: absolute; content: ""; height: 2px; background: var(--accent); bottom: -1px; left: 0; right: 0; }
.inspector_body { padding: 17px 18px; min-height: 0; flex: 1; overflow-y: auto; }
.field { margin-bottom: 15px; min-width: 0; }
.field label { display: block; color: #697187; font-size: 12px; font-weight: 500; margin-bottom: 7px; }
.field label .required { color: var(--danger); }
.field input, .field textarea, .field select { width: 100%; min-width: 0; border: 1px solid #e0e3ed; background: #fff; border-radius: 7px; padding: 9px 10px; color: #42495e; font-size: 14px; line-height: 1.8; }
.field input, .field select { min-height: 36px; }
.field textarea { resize: vertical; min-height: 91px; }
.field input::placeholder, .field textarea::placeholder { color: #b2b5c1; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #afa0ed; }
.field small { display: block; margin-top: 6px; color: #7f879a; font-size: 11px; line-height: 1.8; }
.field_row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 11px; }
.tag_options { display: flex; flex-wrap: wrap; gap: 7px; }
.tag_chip { border: 1px solid #e0e3ed; border-radius: 5px; padding: 5px 9px; color: #737c91; background: #fafafd; font-size: 11px; }
.tag_chip.active { border-color: #c6bcf0; background: var(--accent_soft); color: var(--accent); }
.object_list { display: flex; flex-direction: column; gap: 7px; }
.object_item { display: flex; align-items: center; width: 100%; text-align: left; gap: 9px; border: 1px solid var(--line); border-radius: 7px; padding: 10px; color: #687187; font-size: 13px; }
.object_item.active { border-color: #c8bdf3; background: #f6f4fd; color: var(--accent); }
.object_item .muted { margin-left: auto; font-size: 11px; }
.color_dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.form_section { padding-top: 16px; border-top: 1px solid var(--line); margin-top: 4px; }
.form_section h3 { font-size: 12px; color: #697187; margin-bottom: 12px; }
.form_section > p.muted { font-size: 13px !important; line-height: 1.9; }
.form_section p svg { display: inline-block; vertical-align: -.25em; width: 16px; height: 16px; margin: 0 2px; }
.inline_notice, .notice { border-radius: 7px; padding: 11px 12px; background: #f5f3fb; color: #77688f; font-size: 12px; line-height: 1.9; }
.notice { margin-bottom: 14px; }
.notice.error, .inline_notice.error { color: #b35b6a; background: #fbf0f2; }
.inspector_footer { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 9px; background: #fff; font-size: 12px; color: #71798c; }
.inspector_footer .button { flex: 1; }
.button, .header_actions > button, .heading_actions > button { display: inline-flex; justify-content: center; align-items: center; gap: 7px; border: 1px solid #dfe2eb; background: #fff; border-radius: 7px; padding: 8px 13px; font-size: 12px; font-weight: 550; white-space: nowrap; line-height: 1.7; }
.button:hover, .header_actions > button:hover, .heading_actions > button:hover { background: #f7f6fc; border-color: #cfc6ed; }
.button.primary, button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.button.primary:hover, button.primary:hover { background: #5948cc; border-color: #5948cc; }
.button.danger, button.danger { color: var(--danger); background: #fff; border: 1px solid #efdce1; }
.button.danger:hover, button.danger:hover { background: #fbf0f2; }
.button.small { padding: 5px 9px; font-size: 11px; }
.header_actions > .ghost, .heading_actions > .ghost { border-color: transparent; background: transparent; color: #868b9c; }
.badge, .pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #e2dcf3; padding: 2px 7px; border-radius: 5px; color: #7d6caa; background: #f8f6fd; font-size: 10px; white-space: nowrap; font-weight: 500; }
.badge.success, .pill.success { color: var(--success); background: #edf7f3; border-color: #dcefe7; }
.badge.warning { color: #b58d48; background: #fff9ed; border-color: #f2e8cf; }
.empty_state { color: #7c8598; text-align: center; padding: 34px 20px; font-size: 13px; line-height: 1.9; }
.empty_state svg { margin: 0 auto 12px; width: 30px; height: 30px; color: #bcb5d8; }
.app_footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: var(--footer); padding: 0 24px; border-top: 1px solid var(--line); background: #fff; color: #a4a8b6; font-size: 9px; }
.app_footer > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app_footer .status_dot { display: inline-block; margin-right: 7px; vertical-align: middle; }
.footer_separator { color: #d5d7e0; padding: 0 9px; }
.app_footer kbd { font: 9px Consolas, monospace; border: 1px solid #e6e7ef; border-radius: 3px; padding: 1px 4px; color: #8b8fa0; margin-right: 3px; }
.review_layout, .evaluation_layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.review_card { min-width: 0; padding: 21px; }
.eval_card { min-width: 0; padding: 0; overflow: hidden; }
.review_card h2, .eval_card h2 { margin-bottom: 7px; }
.review_card > p, .eval_card > p { color: var(--muted); font-size: 13px; margin-bottom: 17px; }
.eval_card > h2, .eval_card > p { margin: 20px; }
.check_list { display: grid; gap: 12px; padding: 13px 0; }
.check_item { display: flex; align-items: flex-start; gap: 9px; font-size: 13px; color: #626d82; }
.check_item input { accent-color: var(--accent); margin: 5px 0 0; }
.issue_list { display: grid; gap: 8px; margin: 12px 0; }
.issue_item { border: 1px solid #efdde3; background: #fcf5f7; color: #a65064; padding: 11px 13px; border-radius: 7px; font-size: 12px; text-align: left; }
.issue_item small { display: block; color: #b37c8a; font: 10px Consolas, monospace; margin-top: 5px; overflow-wrap: anywhere; }
.review_actions { display: flex; gap: 9px; padding-top: 15px; flex-wrap: wrap; }
.clip_controls { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:12px 16px; border-top:1px solid var(--line); font-size:11px; }
.clip_controls select { padding:5px; background:white; border:1px solid var(--line); border-radius:5px; }
.clip_controls small { color:var(--muted); width:100%; }
.review_progress { background: var(--accent_soft); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 12px 0; font-weight: 600; font-size: 12px; }
.review_progress small, .review_entry small { display: block; color: var(--muted); font-weight: 400; margin-top: 5px; }
.review_entry { background: #f8f8fc; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; overflow-wrap: anywhere; font-size: 12px; }
.review_entry p { margin-top: 8px; white-space: pre-wrap; }
.badge.status_disputed { color: #9a6617; background: #fff2d8; }
.status_dot.status_disputed { background: #c18a31; }
.pair_transport { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.pair_buttons { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; min-width: 0; }

    audio: { name: "\u97F3\u9891", project: "Dolphin", version: "annota_audio_v2", idField: "id", mediaLabel: "\u97F3\u9891", requiredFields: ["id", "source_id", "audio_file", "duration", "language", "dialect", "scene", "kind", "segments", "noise_tags"], textFields: ["id", "source_id", "audio_file", "language", "dialect", "scene"], summary: "\u5206\u6BB5\u8F6C\u5199 + \u8BF4\u8BDD\u4EBA + \u566A\u58F0\u5C5E\u6027 + \u5355\u901A\u9053\u65F6\u95F4", contract: "id / source_id / audio_file / duration / language / dialect / scene / kind / segments / noise_tags", ruleNotes: ["\u6BCF\u6BB5 start/end \u4E3A\u6709\u9650\u6570\u5B57\uFF0C0 \u2264 start < end \u2264 duration\uFF1B\u672C\u5355\u901A\u9053\u89C4\u5219\u4E0D\u5141\u8BB8\u7247\u6BB5\u91CD\u53E0\u3002", "text \u4E0E speaker \u5FC5\u586B\uFF1B\u975E\u8BED\u97F3\u4E5F\u9700\u586B\u5199\u7EA6\u5B9A\u6807\u8BB0\u548C\u201C\u4E0D\u9002\u7528\u201D\u3002", "kind \u4E3A speech/noise\uFF1Bdialect \u4F7F\u7528\u7EA6\u5B9A\u679A\u4E3E\u3002", "noise_tags \u4F7F\u7528\u7EA6\u5B9A\u6807\u7B7E\uFF0Ckind=noise \u65F6\u81F3\u5C11\u4E00\u9879\uFF1B\u4E0D\u68C0\u67E5 ASR \u6B63\u786E\u7387\u3002"], limitation: "\u4E0D\u8BFB\u53D6\u771F\u5B9E\u97F3\u9891\u65F6\u957F\u3001\u4E0D\u8BC6\u522B\u65B9\u8A00\u4E0E\u8BF4\u8BDD\u4EBA\u3001\u4E0D\u5224\u65AD\u8F6C\u5199\u51C6\u786E\u6027\uFF1BCER \u5728\u6A21\u578B\u8BC4\u6D4B\u4E2D\u5355\u72EC\u8BA1\u7B97\u3002" }
  };

  // src/review-view.js
  function renderReviewHistory(task) {
    if (!task.reviews.length) return '<small class="muted">\u5C1A\u65E0\u5BA1\u6838\u8BB0\u5F55</small>';
    return task.reviews.slice().reverse().map((review) => `<article class="review_entry"><strong>${escapeHtml(REVIEW_LABELS[review.decision] || "\u5386\u53F2\u590D\u6838")} \xB7 ${escapeHtml(review.reviewer || "\u65E7\u7248\u672A\u8BB0\u5F55\u59D3\u540D")}</strong><small>${review.round ? `\u7B2C ${review.round} \u8F6E` : "\u65E7\u7248\u5355\u6B21\u590D\u6838\u8BB0\u5F55"} \xB7 r${review.revision} \xB7 ${escapeHtml(review.at)}</small><p>${escapeHtml(review.note)}</p></article>`).join("");
  }
  function renderReviewSection(task) {
    const current = getCurrentReviews(task);
    const first = current.find((review) => review.decision === "opinion");
    const active = ["pending", "disputed"].includes(task.status);
    const arbitration = task.status === "disputed";
    const complete = task.status === "approved" && current.some((review) => ["approved", "arbitrated"].includes(review.decision));
    const progress = complete ? "\u672C\u8F6E\u5DF2\u5B8C\u6210" : task.status === "approved" ? "\u65E7\u7248\u9A8C\u6536 \xB7 \u672A\u6267\u884C\u672C\u8F6E\u53CC\u4EBA\u590D\u6838" : task.status === "returned" ? "\u672C\u8F6E\u5DF2\u9000\u56DE \xB7 \u4FEE\u6539\u540E\u91CD\u65B0\u63D0\u4EA4" : task.status === "draft" ? "\u8BF7\u5148\u5B8C\u6210\u6807\u6CE8\u5E76\u63D0\u4EA4\u590D\u6838" : arbitration ? "\u5B58\u5728\u5206\u6B67 \xB7 \u7B49\u5F85\u4EF2\u88C1" : first ? "1 / 2 \xB7 \u7B49\u5F85\u53E6\u4E00\u4F4D\u590D\u6838\u4EBA" : "0 / 2 \xB7 \u7B49\u5F85\u9996\u8F6E\u610F\u89C1";
    const label = arbitration ? "\u4EF2\u88C1\u901A\u8FC7" : first ? "\u7B2C\u4E8C\u4EBA\u786E\u8BA4\u9A8C\u6536" : "\u8BB0\u5F55\u9996\u8F6E\u901A\u8FC7\u610F\u89C1";
    return `<div class="form_section"><h3>\u53CC\u4EBA\u590D\u6838 <span class="pill">\u7B2C ${task.reviewRound || 0} \u8F6E</span></h3><div class="review_progress" id="review-progress">${progress}${first ? `<small>\u9996\u4F4D\u590D\u6838\u4EBA\uFF1A${escapeHtml(first.reviewer)}</small>` : ""}</div><div class="check_list">${["\u63CF\u8FF0\u6216\u8F6C\u5199\u4E0E\u7D20\u6750\u4E00\u81F4", "\u65F6\u95F4\u6216\u533A\u57DF\u51C6\u786E\uFF0C\u65E0\u9057\u6F0F", "\u5C5E\u6027\u4E0E\u6807\u7B7E\u7B26\u5408\u4EFB\u52A1\u89C4\u8303"].map((text, index) => `<label class="check_item"><input type="checkbox" data-review-check="${index}" ${!active ? "disabled" : ""}> ${text}</label>`).join("")}</div><div class="field"><label for="reviewer">${arbitration ? "\u4EF2\u88C1\u4EBA" : "\u672C\u6B21\u590D\u6838\u4EBA"}</label><input id="reviewer" autocomplete="off" placeholder="\u586B\u5199\u59D3\u540D\uFF1B\u7B2C\u4E8C\u4F4D\u987B\u4E0E\u9996\u4F4D\u4E0D\u540C" ${!active ? "disabled" : ""}></div><div class="field"><label for="review-note">${arbitration ? "\u4EF2\u88C1\u7ED3\u8BBA / \u9000\u56DE\u7406\u7531" : "\u72EC\u7ACB\u610F\u89C1 / \u9000\u56DE\u6216\u5206\u6B67\u7406\u7531"} \xB7 \u5FC5\u586B</label><textarea id="review-note" placeholder="\u6307\u51FA\u5177\u4F53\u7247\u6BB5\u3001\u6838\u5BF9\u4F9D\u636E\u4E0E\u5904\u7406\u5EFA\u8BAE\u3002" ${!active ? "disabled" : ""}></textarea></div><div class="review_actions"><button class="button danger" data-action="return" ${!active ? "disabled" : ""}>\u9000\u56DE\u4FEE\u6539</button><button class="button primary" data-action="approve" ${!active ? "disabled" : ""}>${label}</button>${!arbitration ? `<button class="button" data-action="dispute" ${!active ? "disabled" : ""}>\u63D0\u4EA4\u5206\u6B67</button>` : ""}</div><div class="inline_notice" style="margin-top:15px">\u4E24\u540D\u4E0D\u540C\u59D3\u540D\u5206\u522B\u586B\u5199\u610F\u89C1\u540E\u786E\u8BA4\uFF1B\u5206\u6B67\u53EF\u4EA4\u4EF2\u88C1\u3002\u4FEE\u6539\u6807\u6CE8\u540E\u987B\u91CD\u65B0\u63D0\u4EA4\u3002\u6B64\u5904\u6A21\u62DF\u672C\u5730\u6D41\u7A0B\uFF0C\u4E0D\u9A8C\u8BC1\u771F\u5B9E\u8EAB\u4EFD\u6216\u9694\u79BB\u610F\u89C1\u3002</div></div><div class="form_section"><h3>\u590D\u6838\u8BB0\u5F55</h3>${renderReviewHistory(task)}</div>`;
  }

  // src/views.js
  var PHASE_COPY = { annotation: ["\u6570\u636E\u6807\u6CE8", "\u6211\u5728\u5236\u4F5C\u6570\u636E\uFF1A\u8BB0\u5F55\u7D20\u6750\u4E2D\u771F\u5B9E\u5B58\u5728\u7684\u5185\u5BB9\u3002"], review: ["\u6570\u636E\u8D28\u68C0", "\u6211\u5728\u68C0\u67E5\u6570\u636E\uFF1A\u590D\u6838\u4EBA\u5DE5\u6807\u6CE8\u7684\u5185\u5BB9\u4E0E\u7ED3\u6784\u3002"], evaluation: ["\u6A21\u578B\u8BC4\u6D4B", "\u6211\u5728\u68C0\u9A8C\u6A21\u578B\uFF1A\u53EA\u5224\u65AD\u539F\u59CB\u6A21\u578B\u8F93\u51FA\uFF0C\u4E0D\u6539\u5199\u6807\u6CE8\u3002"] };
  function field(options) {
    const { bind, label, value = "", type = "text", hint = "", rows = 3 } = options;
    const id = `field-${bind.replaceAll(".", "-")}`;
    const attrs = `id="${id}" data-bind="${bind}"`;
    const control = type === "textarea" ? `<textarea ${attrs} rows="${rows}">${escapeHtml(value)}</textarea>` : `<input ${attrs} type="${type}" value="${escapeHtml(value)}" ${type === "number" ? 'step="0.001"' : ""}>`;
    return `<div class="field"><label for="${id}">${label}</label>${control}${hint ? `<small>${hint}</small>` : ""}</div>`;
  }
  function selectField(options) {
    const { bind, label, value, choices } = options;
    const id = `field-${bind.replaceAll(".", "-")}`;
    return `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-bind="${bind}">${choices.map((choice) => `<option value="${escapeHtml(choice)}" ${choice === value ? "selected" : ""}>${escapeHtml(choice)}</option>`).join("")}</select></div>`;
  }
  function taskCard(task, active) {
    const count = task.modality === "image" ? `${task.regions.length} \u4E2A\u533A\u57DF` : `${task.segments.length} \u4E2A\u7247\u6BB5`;
    return `<button class="task_card ${active ? "active" : ""}" data-task="${escapeHtml(task.id)}" aria-pressed="${active}"><span class="task_thumb">${task.modality === "image" && task.media.url ? `<img alt="" src="${escapeHtml(task.media.url)}">` : icon(task.modality)}</span><span class="task_summary"><strong>${escapeHtml(task.title)}</strong><span>${escapeHtml(task.id)} \xB7 ${count} \xB7 ${STATUS_LABELS[task.status]}</span></span><i class="status_dot status_${task.status}"></i></button>`;
  }
  function heading(task, phase) {
    const [title, copy] = PHASE_COPY[phase];
    return `<div class="workspace_heading"><div><div class="eyebrow">${PROJECTS[task.modality].name} <span>/</span> ${escapeHtml(task.id)} <span>/</span> ${title}</div><h1>${escapeHtml(task.title)}</h1><p class="subtitle">${copy}</p></div><div class="heading_actions"><span class="badge status_${task.status}">${STATUS_LABELS[task.status]}</span>${phase === "annotation" ? `<button class="button" data-action="save">\u4FDD\u5B58\u8349\u7A3F</button><button class="button primary" data-action="submit" ${["pending", "approved", "disputed"].includes(task.status) ? "disabled" : ""}>\u63D0\u4EA4\u8D28\u68C0 ${icon("chevron")}</button>` : `<button class="button" data-action="back-to-annotation">${icon("back")} \u8FD4\u56DE\u6807\u6CE8</button>`}</div></div>`;
  }
  function mediaToolbar(task, editable, selection) {
    const imageTools = `<button class="icon_button ${selection.tool === "select" ? "active" : ""}" data-action="tool-select" title="\u9009\u62E9\u4E0E\u79FB\u52A8\uFF08V\uFF09" aria-label="\u9009\u62E9\u4E0E\u79FB\u52A8">${icon("pointer")}</button>${editable ? `<button class="icon_button ${selection.tool === "box" ? "active" : ""}" data-action="tool-box" title="\u7ED8\u5236\u76EE\u6807\u6846\uFF08B\uFF09" aria-label="\u7ED8\u5236\u76EE\u6807\u6846">${icon("box")}</button><button class="icon_button" data-action="undo" title="\u64A4\u9500\u4E0A\u4E00\u6B21\u6807\u6CE8\u64CD\u4F5C" aria-label="\u64A4\u9500">${icon("undo")}</button>` : ""}`;
    return `<div class="media_toolbar"><div class="tool_group">${task.modality === "audio" ? `${icon("audio")}<span class="toolbar_label">\u539F\u59CB\u97F3\u9891</span>` : imageTools}</div><div class="tool_group">${task.modality === "image" ? `<button class="icon_button" data-action="zoom-out" aria-label="\u7F29\u5C0F">${icon("minus")}</button><span id="zoom-level" class="toolbar_label">100%</span><button class="icon_button" data-action="zoom-in" aria-label="\u653E\u5927">${icon("plus")}</button><button class="icon_button" data-action="fit" aria-label="\u9002\u5E94\u7A97\u53E3">${icon("fit")}</button>` : `<span class="toolbar_label">${task.modality === "audio" ? "WAV / \u5206\u6BB5\u8F6C\u5199" : "VIDEO / \u7247\u6BB5\u4E0E\u8F68\u8FF9"}</span>`}<button class="icon_button" data-action="task-info" aria-label="\u7D20\u6750\u6765\u6E90\u4E0E\u89C4\u8303" title="\u7D20\u6750\u6765\u6E90\u4E0E\u89C4\u8303">${icon("info")}</button></div></div>`;
  }
  function transport(task) {
    return `<div class="transport"><button id="play-toggle" class="play_button" data-action="play" aria-label="\u64AD\u653E">${icon("play")}</button>${task.modality === "video" ? `<button class="icon_button" data-action="previous-frame" aria-label="\u540E\u90001/30\u79D2">${icon("back")}</button><button class="icon_button" data-action="next-frame" aria-label="\u524D\u8FDB1/30\u79D2">${icon("next")}</button>` : ""}<span class="time_readout"><b id="current-time">00:00.00</b> <span>/</span> <span id="duration-time">${formatTime(task.media.duration)}</span></span><input id="seek-slider" class="seek_slider" type="range" min="0" max="${task.media.duration}" step="0.001" value="0" aria-label="\u64AD\u653E\u4F4D\u7F6E"><select id="playback-speed" class="speed_select" aria-label="\u64AD\u653E\u500D\u901F"><option value="0.5">0.5\xD7</option><option value="0.75">0.75\xD7</option><option value="1" selected>1\xD7</option><option value="1.25">1.25\xD7</option><option value="1.5">1.5\xD7</option><option value="2">2\xD7</option></select><button class="icon_button" id="loop-toggle" data-action="loop" aria-label="\u5FAA\u73AF\u6240\u9009\u7247\u6BB5" aria-pressed="false" title="\u5FAA\u73AF\u6240\u9009\u7247\u6BB5">${icon("loop")}</button></div>`;
  }
  function mediaPanel(task, editable, selection) {
    const source = escapeHtml(task.media.url || "");
    const visual = task.modality === "image" ? `<img id="visual-media" src="${source}" alt="${escapeHtml(task.title)}" draggable="false">` : `<video id="media-player" src="${source}" preload="auto" playsinline></video>`;
    const audioSource = task.media.imported ? "\u672C\u5730\u5BFC\u5165\u7D20\u6750" : task.segments.length && task.segments.every((segment) => String(segment.label || "").toLowerCase() === "noise") ? "\u7A0B\u5E8F\u566A\u58F0 / \u6559\u5B66\u6837\u4F8B" : "\u5408\u6210\u666E\u901A\u8BDD / \u6559\u5B66\u6837\u4F8B";
    const stage = task.modality === "audio" ? `<div class="media_stage audio_stage"><div class="audio_identity"><div class="audio_orb">${icon("audio")}</div><div><div class="wave_summary">DOLPHIN \xB7 AUDIO ANNOTATION</div><h2>${escapeHtml(task.media.name)}</h2><p>${audioSource} <span>\xB7</span> ${formatTime(task.media.duration)}</p></div></div><audio id="media-player" src="${source}" preload="auto"></audio></div>` : `<div class="visual_viewport"><div id="visual-surface" class="visual_surface">${visual}<svg id="annotation-overlay" class="annotation_overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-label="\u6807\u6CE8\u753B\u5E03"></svg></div></div>`;
    return `<section class="media_panel">${mediaToolbar(task, editable, selection)}${stage}${task.modality === "image" ? "" : transport(task)}</section>`;
  }
  function timeline(task, editable) {
    if (task.modality === "image") return "";
    return `<section class="timeline_panel"><div class="timeline_header"><h3>${task.modality === "audio" ? "\u97F3\u9891\u6CE2\u5F62" : "\u89C6\u9891\u65F6\u95F4\u8F74"}</h3><small>${editable ? "\u62D6\u9009\u65B0\u7247\u6BB5 \xB7 \u70B9\u51FB\u5B9A\u4F4D" : "\u70B9\u51FB\u65F6\u95F4\u8F74\u5B9A\u4F4D\u8BD5\u542C"}</small></div><canvas id="timeline-canvas" class="timeline_canvas" aria-label="${task.modality === "audio" ? "\u97F3\u9891\u6CE2\u5F62\u4E0E\u7247\u6BB5\u9009\u62E9" : "\u89C6\u9891\u7247\u6BB5\u65F6\u95F4\u8F74"}"></canvas><div class="timeline_ruler"><span>00:00</span><span>${formatTime(task.media.duration / 4)}</span><span>${formatTime(task.media.duration / 2)}</span><span>${formatTime(task.media.duration * 3 / 4)}</span><span>${formatTime(task.media.duration)}</span></div><div id="segment-lane" class="segment_lane"></div><div class="clip_controls">${editable ? `<label for="clip-duration">\u5FEB\u6377\u7247\u6BB5</label><select id="clip-duration" aria-label="\u5FEB\u6377\u7247\u6BB5\u65F6\u957F">${[3, 4, 5, 6, 7, 8, 9, 10].map((seconds) => `<option value="${seconds}" ${seconds === 3 ? "selected" : ""} ${seconds > task.media.duration ? "disabled" : ""}>${seconds} \u79D2</option>`).join("")}</select><button class="button small" data-action="quick-clip" ${task.media.duration < 3 ? "disabled" : ""}>\u4ECE\u5F53\u524D\u4F4D\u7F6E\u5207\u7247</button>` : ""}<button class="button small" data-action="export-clip" ${!task.segments.length ? "disabled" : ""}>\u5BFC\u51FA\u6240\u9009\u771F\u5B9E\u7247\u6BB5</button><small>\u8D77\u6B62\u65F6\u95F4\u4E0E\u8F6C\u5199\u5173\u8054\uFF1B\u8BD5\u542C\u6838\u5BF9\u97F3\u6587\u5BF9\u9F50\u3002</small></div></section>`;
  }
  function segmentRows(task, selection, editable) {
    if (!task.segments.length) return '<div class="empty_state">\u5C1A\u65E0\u7247\u6BB5\u3002\u62D6\u9009\u65F6\u95F4\u8F74\u6216\u70B9\u51FB\u201C\u6DFB\u52A0\u7247\u6BB5\u201D\uFF0C\u4ECE\u7A7A\u767D\u5F00\u59CB\u3002</div>';
    return task.segments.map((segment, index) => `<div class="segment_row ${selection.segmentId === segment.id ? "active" : ""}" data-segment="${escapeHtml(segment.id)}" role="button" tabindex="0"><span class="segment_index">${String(index + 1).padStart(2, "0")}</span><span class="segment_times">${formatTime(segment.start)} \u2014 ${formatTime(segment.end)} <span>\xB7 ${escapeHtml(segment.speaker || segment.label || "\u7247\u6BB5")}</span></span><span class="segment_text">${escapeHtml(segment.text || segment.description?.action || "\u5F85\u586B\u5199\u6807\u6CE8")}</span><span class="row_actions"><button data-play-segment="${escapeHtml(segment.id)}" aria-label="\u8BD5\u542C\u7247\u6BB5${index + 1}" title="\u64AD\u653E\u6B64\u7247\u6BB5">${icon("play")}</button>${editable ? `<button data-delete-segment="${escapeHtml(segment.id)}" aria-label="\u5220\u9664\u7247\u6BB5${index + 1}" title="\u5220\u9664\u7247\u6BB5">${icon("trash")}</button>` : ""}</span></div>`).join("");
  }
  function segmentsPanel(task, selection, editable) {
    if (task.modality === "image") return `<section class="segment_section"><div class="section_heading"><h2>\u56FE\u50CF\u6807\u6CE8</h2><small>${task.regions.length} \u4E2A\u76EE\u6807\u533A\u57DF</small></div><div class="inline_notice" style="margin:16px">${editable ? "\u70B9\u51FB\u53F3\u4FA7\u7F16\u8F91 Caption\uFF1B\u4F7F\u7528\u6846\u9009\u5DE5\u5177\uFF0C\u5728\u56FE\u50CF\u4E0A\u62D6\u51FA\u76EE\u6807\u533A\u57DF\u3002" : "\u5BF9\u7167\u56FE\u50CF\u68C0\u67E5\u4EBA\u5DE5 Caption\u3001\u6807\u7B7E\u548C\u533A\u57DF\u662F\u5426\u51C6\u786E\u3002"}</div></section>`;
    return `<section class="segment_section"><div class="section_heading"><h2>${task.modality === "audio" ? "\u9010\u6BB5\u8F6C\u5199" : "\u5206\u6BB5\u63CF\u8FF0"} <span class="muted">${task.segments.length}</span></h2>${editable ? `<button class="button small" data-action="add-segment">${icon("plus")} \u6DFB\u52A0\u7247\u6BB5</button>` : "<small>\u4EBA\u5DE5\u6807\u6CE8\u8BB0\u5F55 \xB7 \u53EA\u8BFB</small>"}</div><div id="segment-list" class="segment_list">${segmentRows(task, selection, editable)}</div></section>`;
  }
  function audioEditor(task, selection) {
    const segment = task.segments.find((segment2) => segment2.id === selection.segmentId);
    if (!segment) return '<div class="empty_state">\u9009\u4E2D\u6216\u65B0\u5EFA\u4E00\u4E2A\u7247\u6BB5\uFF0C\u5373\u53EF\u586B\u5199\u8F6C\u5199\u548C\u5C5E\u6027\u3002</div>';
    return `${timeFields(segment)}${selectField({ bind: "segment.label", label: "\u7247\u6BB5\u7C7B\u578B", value: segment.label, choices: ["Speech", "Noise"] })}${field({ bind: "segment.text", label: "\u8F6C\u5199\u6587\u672C", value: segment.text, type: "textarea", hint: "\u5FE0\u5B9E\u8BB0\u5F55\u542C\u5230\u7684\u5185\u5BB9\uFF1B\u566A\u58F0\u53EF\u5199 [\u566A\u58F0]\u3002", rows: 4 })}<div class="field_row">${field({ bind: "segment.speaker", label: "\u8BF4\u8BDD\u4EBA", value: segment.speaker })}${field({ bind: "segment.language", label: "\u8BED\u79CD", value: segment.language })}</div>${selectField({ bind: "segment.dialect", label: "\u65B9\u8A00 / \u53E3\u97F3 \xB7 \u7EA6\u5B9A\u679A\u4E3E", value: segment.dialect, choices: ["", "\u666E\u901A\u8BDD\uFF08\u5408\u6210\uFF09", ...AUDIO_DIALECTS] })}${field({ bind: "segment.scene", label: "\u573A\u666F", value: segment.scene })}<div class="field"><label>\u6574\u6761\u97F3\u9891\u7684\u566A\u58F0 / \u9759\u97F3\u6807\u7B7E</label><div class="tag_options">${[...AUDIO_NOISE_TAGS].map((tag) => `<button class="tag_chip ${task.noiseTags?.includes(tag) ? "active" : ""}" data-noise-tag="${tag}">${tag}</button>`).join("")}</div><small>Noise \u4EFB\u52A1\u81F3\u5C11\u4E00\u9879\uFF1B\u7EAF\u566A\u58F0\u8BF4\u8BDD\u4EBA\u53EF\u586B\u201C\u4E0D\u9002\u7528\u201D\u3002</small></div><label class="check_item"><input type="checkbox" data-bind="segment.mixed" ${segment.mixed ? "checked" : ""}> \u5305\u542B\u8BED\u79CD\u6DF7\u8BF4</label>`;
  }
  function timeFields(segment) {
    return `<div class="field_row">${field({ bind: "segment.start", label: "\u8D77\u59CB\u65F6\u95F4 \xB7 \u79D2", value: segment.start, type: "number" })}${field({ bind: "segment.end", label: "\u7ED3\u675F\u65F6\u95F4 \xB7 \u79D2", value: segment.end, type: "number" })}</div><div class="tool_group" style="margin:-5px 0 15px"><button class="button small" data-action="set-start">\u53D6\u5F53\u524D\u8D77\u70B9 [</button><button class="button small" data-action="set-end">\u53D6\u5F53\u524D\u7EC8\u70B9 ]</button></div>`;
  }
  function videoEditor(task, selection) {
    if (selection.inspectorTab === "objects") return objectEditor(task, selection);
    const segment = task.segments.find((segment2) => segment2.id === selection.segmentId);
    if (!segment) return '<div class="empty_state">\u5728\u65F6\u95F4\u8F74\u4E0A\u62D6\u9009\u4E00\u4E2A\u7247\u6BB5\uFF0C\u8BB0\u5F55\u4E03\u9879 Dense Caption\u3002</div>';
    return `${timeFields(segment)}${field({ bind: "segment.overlapReason", label: "\u91CD\u53E0\u539F\u56E0\uFF08\u7247\u6BB5\u91CD\u53E0\u65F6\u5FC5\u586B\uFF09", value: segment.overlapReason || "" })}${field({ bind: "segment.text", label: "\u7247\u6BB5\u6458\u8981", value: segment.text })}${Object.entries(VIDEO_FIELDS).map(([key, label]) => field({ bind: `description.${key}`, label, value: segment.description?.[key] || "", type: "textarea", rows: 2 })).join("")}`;
  }
  function imageEditor(task, selection) {
    if (selection.inspectorTab === "objects") return objectEditor(task, selection);
    const tags = ["\u529E\u516C", "\u9759\u7269", "\u6444\u5F71", "\u4EBA\u7269", "\u81EA\u7136", "\u63D2\u753B", "\u6C34\u679C", "\u4E2D\u6587\u6587\u5B57"];
    return `${field({ bind: "task.caption", label: "\u56FE\u50CF Caption", value: task.caption, type: "textarea", rows: 7, hint: "\u4E3B\u4F53 \u2192 \u52A8\u4F5C / \u72B6\u6001 \u2192 \u573A\u666F \u2192 \u5149\u5F71\uFF1B\u4E0D\u6DFB\u52A0\u56FE\u4E2D\u4E0D\u5B58\u5728\u7684\u7EC6\u8282\u3002" })}<div class="field"><label>\u5185\u5BB9\u6807\u7B7E</label><div class="tag_options">${tags.map((tag) => `<button class="tag_chip ${task.tags.includes(tag) ? "active" : ""}" data-tag="${tag}" aria-pressed="${task.tags.includes(tag)}">${tag}</button>`).join("")}</div></div><div class="form_section"><h3>\u533A\u57DF\u6807\u6CE8</h3><p class="muted" style="font-size:12px">\u4F7F\u7528 ${icon("box")} \u6846\u9009\u5DE5\u5177\u521B\u5EFA\u76EE\u6807\uFF0C\u518D\u5207\u6362\u201C\u76EE\u6807\u533A\u57DF\u201D\u7F16\u8F91\u6807\u7B7E\u4E0E\u4F4D\u7F6E\u3002</p></div>`;
  }
  function objectEditor(task, selection) {
    const isVideo = task.modality === "video";
    const collection = isVideo ? task.tracks : task.regions;
    const selectedId = isVideo ? selection.trackId : selection.regionId;
    const object = collection.find((item) => item.id === selectedId);
    const listing = `<div class="object_list">${collection.map((item, index) => `<button class="object_item ${item.id === selectedId ? "active" : ""}" data-object="${escapeHtml(item.id)}"><i class="color_dot"></i>${escapeHtml(item.label)}<span class="muted">${isVideo ? `${item.keyframes.length} \u5173\u952E\u5E27` : `#${index + 1}`}</span></button>`).join("") || '<div class="empty_state">\u9009\u62E9\u6846\u9009\u5DE5\u5177\uFF0C\u5728\u753B\u9762\u4E0A\u62D6\u51FA\u7B2C\u4E00\u4E2A\u76EE\u6807\u6846\u3002</div>'}</div>`;
    if (!object) return listing;
    const label = field({ bind: "object.label", label: isVideo ? "\u8F68\u8FF9\u6807\u7B7E" : "\u533A\u57DF\u6807\u7B7E", value: object.label });
    const detail = isVideo ? `<div class="inline_notice">\u79FB\u52A8\u64AD\u653E\u4F4D\u7F6E\u540E\uFF0C\u518D\u6B21\u6846\u9009\u5373\u53EF\u4E3A\u5F53\u524D\u8F68\u8FF9\u6DFB\u52A0\u5173\u952E\u5E27\u3002\u9996\u672B\u5173\u952E\u5E27\u4E4B\u95F4\u7EBF\u6027\u63D2\u503C\uFF0C\u8303\u56F4\u4E4B\u5916\u4E0D\u663E\u793A\u3002</div><div class="object_list">${object.keyframes.map((frame) => `<div class="object_item"><span class="mono">${formatTime(frame.time)}</span><button class="icon_button" data-seek="${frame.time}" aria-label="\u5B9A\u4F4D\u5173\u952E\u5E27${frame.time}">${icon("play")}</button><button class="icon_button" data-delete-keyframe="${frame.time}" aria-label="\u5220\u9664\u5173\u952E\u5E27${frame.time}">${icon("trash")}</button></div>`).join("")}</div>` : `<div class="field_row">${field({ bind: "object.x", label: "X \xB7 \u5F52\u4E00\u5750\u6807", value: object.x, type: "number" })}${field({ bind: "object.y", label: "Y \xB7 \u5F52\u4E00\u5750\u6807", value: object.y, type: "number" })}</div><div class="field_row">${field({ bind: "object.width", label: "\u5BBD\u5EA6 \xB7 0\u20131", value: object.width, type: "number" })}${field({ bind: "object.height", label: "\u9AD8\u5EA6 \xB7 0\u20131", value: object.height, type: "number" })}</div>`;
    return `${listing}<div class="form_section">${label}${detail}<button class="button danger small" data-action="delete-object">${icon("trash")} \u5220\u9664${isVideo ? "\u8F68\u8FF9" : "\u533A\u57DF"}</button>${isVideo ? '<button class="button small" data-action="new-track">\uFF0B \u65B0\u76EE\u6807\u8F68\u8FF9</button>' : ""}</div>`;
  }
  function inspector(task, selection) {
    const tabs = task.modality === "audio" ? [["annotation", "\u8F6C\u5199\u4E0E\u5C5E\u6027"]] : task.modality === "video" ? [["annotation", "\u7247\u6BB5\u63CF\u8FF0"], ["objects", "\u76EE\u6807\u8F68\u8FF9"]] : [["annotation", "\u56FE\u6587\u63CF\u8FF0"], ["objects", "\u76EE\u6807\u533A\u57DF"]];
    const editor = { audio: audioEditor, video: videoEditor, image: imageEditor }[task.modality];
    return `<div class="inspector_heading"><h2>\u6807\u6CE8\u68C0\u67E5\u5668</h2><span class="pill">\u4EBA\u5DE5\u6807\u6CE8</span></div><div class="inspector_tabs">${tabs.map(([key, label]) => `<button data-inspector-tab="${key}" class="${selection.inspectorTab === key ? "active" : ""}">${label}</button>`).join("")}</div><div class="inspector_body">${editor(task, selection)}</div><div id="live-validation" class="live_validation"></div><div class="inspector_footer"><span>\u6807\u6CE8\u4FEE\u8BA2 <b class="mono">r${task.revision}</b></span><button class="button small" data-action="save">\u4FDD\u5B58\u8349\u7A3F</button></div>`;
  }
  function reviewPanel(task, issues) {
    return `<div class="inspector_heading"><h2>\u8D28\u68C0\u4E0E\u9A8C\u6536</h2><button class="button small" data-action="json-validate">JSON\u6821\u9A8C</button></div><div class="inspector_body"><div class="form_section" style="border:0;padding-top:0"><h3>\u7ED3\u6784\u68C0\u67E5</h3><div class="notice ${issues.length ? "error" : ""}">${issues.length ? `${issues.length} \u9879\u5F85\u4FEE\u6B63` : "\u7ED3\u6784\u89C4\u5219\u901A\u8FC7 \xB7 \u5185\u5BB9\u4ECD\u9700\u4EBA\u5DE5\u68C0\u67E5"}</div><div class="issue_list">${issues.map((issue) => `<button class="issue_item" data-issue="${escapeHtml(issue.field)}">${escapeHtml(issue.message)}<small>${escapeHtml(issue.field)}</small></button>`).join("")}</div></div>${renderReviewSection(task)}</div>`;
  }
  function cloudReviewPanel(task, cloud2) {
    return `<div class="inspector_heading"><h2>\u4E91\u7AEF\u8D28\u68C0</h2><span class="pill">${escapeHtml(STATUS_LABELS[task.status])}</span></div><div class="inspector_body"><p>\u5206\u5C42\u62BD\u68C0\u7531\u6307\u5B9A\u7684\u4E24\u4F4D\u767B\u5F55\u8D26\u53F7\u72EC\u7ACB\u5224\u65AD\uFF1B\u5224\u65AD\u9F50\u5907\u524D\u9690\u85CF\u5BF9\u65B9\u610F\u89C1\u3002</p><div class="inline_notice" style="margin:16px 0">${cloud2.canEdit ? "\u4FEE\u6539\u6807\u6CE8\u4F1A\u4EA7\u751F\u65B0\u4FEE\u8BA2\uFF0C\u5E76\u4F7F\u672A\u5B8C\u6210\u7684\u65E7\u62BD\u6837\u5931\u6548\u3002" : "\u5F53\u524D\u4EFB\u52A1\u53EA\u8BFB\u3002\u53EA\u6709\u4EFB\u52A1\u8D1F\u8D23\u4EBA\u6216\u9879\u76EE\u7BA1\u7406\u8005\u80FD\u7F16\u8F91\u6807\u6CE8\u3002"}</div><a class="button primary" href="team.html?project=${cloud2.projectId}&tab=quality">\u8FDB\u5165\u9879\u76EE\u5206\u5C42\u62BD\u68C0</a></div>`;
  }
  function comparisonTransport() {
    return `<div class="pair_transport" aria-label="\u53CC\u89C6\u9891\u540C\u6B65\u63A7\u5236"><div class="pair_buttons"><button class="button primary" data-pair-action="toggle" disabled>\u540C\u6B65\u64AD\u653E</button><button class="button" data-pair-action="restart" disabled>\u4ECE\u5934\u540C\u6B65\u64AD\u653E</button><span id="pair-time" class="mono">00:00.00 / 00:00.00</span><label for="pair-speed">\u500D\u901F</label><select id="pair-speed" aria-label="\u53CC\u4FA7\u64AD\u653E\u500D\u901F" disabled>${[0.5, 0.75, 1, 1.25, 1.5, 2].map((rate) => `<option value="${rate}" ${rate === 1 ? "selected" : ""}>${rate}\xD7</option>`).join("")}</select></div><input id="pair-seek" type="range" min="0" max="0" step="0.001" value="0" aria-label="\u53CC\u4FA7\u540C\u6B65\u64AD\u653E\u4F4D\u7F6E" disabled><small id="pair-status" role="status">\u6B63\u5728\u52A0\u8F7D\u4E24\u4FA7\u89C6\u9891\u2026</small><small class="muted">\u540C\u6B65\u63A7\u5236\u4E24\u4FA7\u64AD\u653E\u3001\u6682\u505C\u548C\u5B9A\u4F4D\uFF1B\u6D4F\u89C8\u5668\u5C3D\u529B\u5BF9\u9F50\uFF0C\u4E0D\u4F5C\u4E3A\u9010\u5E27\u6D4B\u91CF\u5DE5\u5177\u3002</small></div>`;
  }
  function evaluationPanel(task) {
    if (task.modality === "audio") return audioEvaluation(task);

    const protection = state2.blocked ? '<div class="notice error">\u539F\u6709\u8349\u7A3F\u635F\u574F\uFF0C\u5DF2\u505C\u6B62\u81EA\u52A8\u8986\u76D6\u3002\u53EF\u5148\u5BFC\u51FA\u5F53\u524D\u5907\u4EFD\uFF0C\u518D\u91CD\u5EFA\u5B58\u50A8\u3002</div><button class="button danger" data-action="reset-storage">\u91CD\u5EFA\u5F53\u524D\u6D4F\u89C8\u5668\u8349\u7A3F</button>' : "";
    showModal("\u628A\u6CE8\u610F\u529B\u7559\u7ED9\u6807\u6CE8", `<div class="help_grid"><div><h3>\u6570\u636E\u6807\u6CE8</h3><p>\u8BB0\u5F55\u7D20\u6750\u91CC\u6709\u4EC0\u4E48\u3002\u97F3\u9891\u5199\u8F6C\u5199\uFF0C\u89C6\u9891\u5199\u7247\u6BB5\u63CF\u8FF0\uFF0C\u56FE\u7247\u5199 Caption \u548C\u76EE\u6807\u6846\u3002</p></div><div><h3>\u6570\u636E\u8D28\u68C0</h3><p>\u5148\u68C0\u67E5\u7ED3\u6784\uFF0C\u518D\u7531\u4E24\u540D\u4E0D\u540C\u59D3\u540D\u5206\u522B\u586B\u5199\u610F\u89C1\uFF1B\u53EF\u9000\u56DE\u3001\u63D0\u4EA4\u5206\u6B67\u6216\u4EF2\u88C1\u3002</p></div><div><h3>\u6A21\u578B\u8BC4\u6D4B</h3><p>\u53EA\u68C0\u67E5\u6A21\u578B\u539F\u59CB\u8F93\u51FA\u3002ASR \u539F\u7A3F\u548C\u4EBA\u5DE5\u4FEE\u8BA2\u7A3F\u5206\u5F00\u3002</p></div><div><h3>\u672C\u5730\u4E0E\u6765\u6E90</h3><p>\u9884\u7F6E\u6570\u636E\u4E3A\u6A21\u62DF\u3002\u5BFC\u5165\u5A92\u4F53\u5B58\u672C\u6D4F\u89C8\u5668\uFF0C\u5907\u4EFD\u4EC5\u542B\u6807\u6CE8\u548C\u5143\u6570\u636E\uFF1B\u8DE8\u8BBE\u5907\u6062\u590D\u9700\u91CD\u65B0\u5173\u8054\u5A92\u4F53\u3002</p></div></div><div class="form_section"><h3>\u5FEB\u6377\u952E</h3><p>\u7A7A\u683C \u64AD\u653E/\u6682\u505C \xB7 [ \u53D6\u8D77\u70B9 \xB7 ] \u53D6\u7EC8\u70B9 \xB7 V \u9009\u62E9 \xB7 B \u6846\u9009 \xB7 Ctrl S \u4FDD\u5B58 \xB7 Ctrl Z \u64A4\u9500 \xB7 Delete \u5220\u9664\u5F53\u524D\u5BF9\u8C61</p></div><div class="inline_notice" style="margin-top:18px">JSON \u901A\u8FC7\u53EA\u8868\u793A\u7B26\u5408\u6240\u68C0\u67E5\u7684\u7ED3\u6784/\u65F6\u95F4/\u5750\u6807\u89C4\u5219\uFF0C\u4E0D\u80FD\u8BC1\u660E\u5185\u5BB9\u51C6\u786E\u6216\u6A21\u578B\u8868\u73B0\u597D\u3002\u672C\u6F14\u793A\u4E0D\u8C03\u7528\u6A21\u578B\u670D\u52A1\u3002</div>${protection}`);
  }
  function showExport() {
    if (cloud) {
      showModal("\u5BFC\u51FA\u5F53\u524D\u4EFB\u52A1", "\u4E91\u7AEF\u9879\u76EE\u4E0E\u590D\u6838\u8BB0\u5F55\u4FDD\u5B58\u5728\u670D\u52A1\u7AEF\uFF1B\u8FD9\u91CC\u5206\u522B\u5BFC\u51FA\u5F53\u524D\u4EBA\u5DE5\u6807\u6CE8\u4E0E\u6A21\u578B\u8BC4\u6D4B\u3002", '<button class="button" data-action="export-current">\u5F53\u524D\u6807\u6CE8 JSON</button><button class="button" data-action="export-evaluation">\u5F53\u524D\u8BC4\u6D4B JSON</button>');
      return;
    }
    showModal("\u5BFC\u51FA\u5DE5\u4F5C\u6210\u679C", '<p>\u6807\u6CE8\u548C\u6A21\u578B\u8BC4\u6D4B\u5206\u522B\u5BFC\u51FA\uFF0C\u5DE5\u4F5C\u533A\u5907\u4EFD\u4FDD\u7559\u5168\u90E8\u8BB0\u5F55\u3002</p><div class="notice" style="margin-top:16px">\u5907\u4EFD JSON \u4E0D\u5305\u542B\u5A92\u4F53\u4E8C\u8FDB\u5236\u6587\u4EF6\u3002\u8BF7\u4FDD\u7559\u539F\u59CB\u97F3\u9891\u3001\u89C6\u9891\u4E0E\u56FE\u7247\u3002</div>', '<button class="button" data-action="export-current">\u5F53\u524D\u6807\u6CE8 JSON</button><button class="button" data-action="export-evaluation">\u5F53\u524D\u8BC4\u6D4B JSON</button><button class="button primary" data-action="export-backup">\u5168\u90E8\u5DE5\u4F5C\u533A\u5907\u4EFD</button>');
  }
  function undoTask() {
    const previous = state2.undo.pop();
    if (!previous) {
      notify("\u6CA1\u6709\u53EF\u64A4\u9500\u7684\u6807\u6CE8\u64CD\u4F5C\u3002");
      return;
    }
    const task = currentTask();
    const evaluation = task.evaluation;
    const revision = task.revision + 1;
    const reviews = task.reviews;
    const reviewRound = task.reviewRound;
    Object.assign(task, previous, { evaluation, reviews, reviewRound, revision, status: "draft", updatedAt: (/* @__PURE__ */ new Date()).toISOString() });
    normaliseSelection();
    saveTasks({ quiet: true });
    renderTasks();
    refreshHeading();
    refreshInspector();
    refreshSegments();
    mediaController?.repaint();
  }
  function setBoundary(key) {
    if (!selectedSegment()) return;
    rememberTask();
    selectedSegment()[key] = Number((mediaController?.currentTime || 0).toFixed(3));
    changedTask();
  }
  function deleteObject() {
    const task = currentTask();
    rememberTask();
    if (task.modality === "video") {
      task.tracks = task.tracks.filter((track) => track.id !== state2.trackId);
      state2.trackId = null;
    } else {
      task.regions = task.regions.filter((region) => region.id !== state2.regionId);
      state2.regionId = null;
    }
    changedTask();
  }
  function setTool(tool) {
    state2.tool = tool;
    workspace.querySelectorAll('[data-action^="tool-"]').forEach((button) => button.classList.toggle("active", button.dataset.action === `tool-${tool}`));
    const overlay = document.querySelector("#annotation-overlay");
    if (overlay) overlay.style.cursor = tool === "box" ? "crosshair" : "default";
  }
  function zoomImage(delta) {
    state2.zoom = delta === 0 ? 1 : clamp(state2.zoom + delta, 0.5, 3);
    const surface = document.querySelector("#visual-surface");
    if (surface) surface.style.transform = `scale(${state2.zoom})`;
    const label = document.querySelector("#zoom-level");
    if (label) label.textContent = `${Math.round(state2.zoom * 100)}%`;
  }
  var ACTIONS = {
    "quick-clip": () => clips.quickClip(),
    "export-clip": () => clips.exportClip(),
    "clip-source": () => clips.chooseFile(),
    "cancel-clip": () => clips.cancel(),
    "json-validate": () => openJsonValidator({ getCurrentTask: currentTask, seedTasks: SEED_TASKS, notify }),
    save: () => saveTasks(),
    submit: submitTask,
    approve: () => reviewTask("approved"),
    return: () => reviewTask("returned"),
    dispute: () => reviewTask("disputed"),
    import: () => {
      relinkId = null;
      document.querySelector("#media-import").click();
    },
    relink: () => {
      relinkId = state2.taskId;
      document.querySelector("#media-import").click();
    },
    "backup-import": () => document.querySelector("#backup-import").click(),
    export: showExport,
    "export-current": exportCurrent,
    "export-backup": exportBackup,
    "export-evaluation": exportEvaluation,
    help: showHelp,
    "task-info": showTaskInfo,
    "close-modal": () => document.querySelector("#modal").close(),
    workspace: () => {
      state2.phase = "annotation";
      renderWorkspace();
    },
    "back-to-annotation": () => {
      state2.phase = "annotation";
      renderWorkspace();
    },
    blank: blankPractice,
    "add-segment": () => addSegment(),
    play: () => mediaController?.playPause(),
    loop: () => {
      state2.loop = !state2.loop;
      mediaController?.setLoop(state2.loop);
      const button = document.querySelector("#loop-toggle");
      button?.classList.toggle("active", state2.loop);
      button?.setAttribute("aria-pressed", String(state2.loop));
    },
    "previous-frame": () => mediaController?.nudge(-1 / 30),
    "next-frame": () => mediaController?.nudge(1 / 30),
    "set-start": () => setBoundary("start"),
    "set-end": () => setBoundary("end"),
    "tool-select": () => setTool("select"),
    "tool-box": () => setTool("box"),
    "zoom-in": () => zoomImage(0.25),
    "zoom-out": () => zoomImage(-0.25),
    fit: () => zoomImage(0),
    undo: undoTask,
    "delete-object": deleteObject,
    "new-track": () => {
      state2.trackId = null;
      setTool("box");
      refreshInspector();
      notify("\u5DF2\u51C6\u5907\u521B\u5EFA\u65B0\u8F68\u8FF9\uFF0C\u8BF7\u5728\u753B\u9762\u4E0A\u6846\u9009\u65B0\u76EE\u6807\u3002");
    },
    "reset-storage": () => {
      state2.blocked = false;
      localStorage.removeItem(STORAGE_KEY);
      saveTasks();
      document.querySelector("#modal").close();
    }
  };
  function handleClick(event) {
    const target = event.target.closest("button,[data-segment]");
    if (!target) return;
    if (target.dataset.action) {
      ACTIONS[target.dataset.action]?.();
      return;
    }
    if (target.dataset.phase) {
      state2.phase = target.dataset.phase;
      renderWorkspace();
      return;
    }
    if (target.dataset.modality) {
      switchModality(target.dataset.modality);
      return;
    }
    if (target.dataset.task) {
      switchTask(target.dataset.task);
      return;
    }
    if (target.dataset.playSegment) {
      mediaController?.playSegment(target.dataset.playSegment);
      return;
    }
    if (target.dataset.deleteSegment) {
      rememberTask();
      currentTask().segments = currentTask().segments.filter((segment) => segment.id !== target.dataset.deleteSegment);
      normaliseSelection();
      changedTask();
      return;
    }
    if (target.dataset.segment) {
      selectSegment(target.dataset.segment);
      return;
    }
    if (target.dataset.inspectorTab) {
      state2.inspectorTab = target.dataset.inspectorTab;
      refreshInspector();
      return;
    }
    if (target.dataset.object) {
      selectObject(target.dataset.object);
      return;
    }
    if (target.dataset.tag) {
      rememberTask();
      const tags = currentTask().tags;
      const index = tags.indexOf(target.dataset.tag);
      if (index >= 0) tags.splice(index, 1);
      else tags.push(target.dataset.tag);
      changedTask();
      return;
    }
    if (target.dataset.noiseTag) {
      rememberTask();
      const task = currentTask();
      task.noiseTags ??= [];
      const index = task.noiseTags.indexOf(target.dataset.noiseTag);
      if (index >= 0) task.noiseTags.splice(index, 1);
      else task.noiseTags.push(target.dataset.noiseTag);
      changedTask();
      return;
    }
    if (target.dataset.seek) {
      mediaController?.seek(Number(target.dataset.seek));
      return;
    }
    if (target.dataset.deleteKeyframe) {
      rememberTask();
      selectedObject().keyframes = selectedObject().keyframes.filter((frame) => frame.time !== Number(target.dataset.deleteKeyframe));
      changedTask();
      return;
    }
    if (target.dataset.issue) locateIssue(target.dataset.issue);
  }
  function switchTask(id) {
    state2.taskId = id;
    state2.undo = [];
    state2.tool = "select";
    state2.inspectorTab = "annotation";
    state2.zoom = 1;
    state2.loop = false;
    renderWorkspace();
  }
  function switchModality(modality) {
    state2.modality = modality;
    state2.query = "";
    state2.filter = "all";
    document.querySelector("#task-search").value = "";
    document.querySelector("#status-filter").value = "all";
    switchTask(state2.tasks.find((task) => task.modality === modality).id);
  }
  function handleKey(event) {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
      event.preventDefault();
      saveTasks();
      return;
    }
    if (event.target.closest("input,textarea,select") || document.querySelector("#modal").open) return;
    if (event.code === "Space") {
      event.preventDefault();
      mediaController?.playPause();
    }
    if (event.key === "?") showHelp();
    if (state2.phase !== "annotation") return;
    if (cloud && !cloud.canEdit) return;
    if (event.key.toLowerCase() === "b") setTool("box");
    if (event.key.toLowerCase() === "v") setTool("select");
    if (event.key === "[") setBoundary("start");
    if (event.key === "]") setBoundary("end");
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
      event.preventDefault();
      undoTask();
    }
    if (event.key === "Delete" && selectedObject()) deleteObject();
    if (event.key === "Enter" && event.target.dataset.segment) selectSegment(event.target.dataset.segment);
  }
  async function initialise() {
    if (loaded.backup) {
      const issues = validateBackup(loaded.backup);
      if (issues.length) {
        state2.tasks = structuredClone(SEED_TASKS);
        state2.blocked = true;
      }
    }
    if (!cloud) state2.tasks = state2.tasks.map(upgradeReviewTask);
    if (!state2.tasks.some((task) => task.id === state2.taskId)) state2.taskId = state2.tasks[0].id;
    state2.modality = currentTask().modality;
    document.addEventListener("click", handleClick);
    document.addEventListener("keydown", handleKey);
    workspace.addEventListener("input", (event) => updateInput(event.target));
    document.querySelector("#task-search").addEventListener("input", (event) => {
      state2.query = event.target.value;
      renderTasks();
    });
    document.querySelector("#status-filter").addEventListener("change", (event) => {
      state2.filter = event.target.value;
      renderTasks();
    });
    document.querySelector("#media-import").addEventListener("change", async (event) => {
      await importMedia([...event.target.files]);
      event.target.value = "";
    });
    document.querySelector("#backup-import").addEventListener("change", async (event) => {
      if (event.target.files[0]) await restoreBackup(event.target.files[0]);
      event.target.value = "";
    });
    window.addEventListener("beforeunload", (event) => {
      if (cloud && (editVersion > savedVersion || cloud.pending)) {
        event.preventDefault();
        event.returnValue = "";
      }
    });
    window.addEventListener("pagehide", () => {
      if (!state2.blocked) saveTasks({ quiet: true });
      for (const url of objectUrls.values()) URL.revokeObjectURL(url);
    });
    hydrateIcons();
    await renderWorkspace();
    if (state2.blocked) {
      document.querySelector("#save-indicator").textContent = "\u8349\u7A3F\u4FDD\u62A4\u4E2D";
      showHelp();
    }
  }
  initialise().catch((error) => {
    workspace.innerHTML = `<div class="notice error">\u5DE5\u4F5C\u53F0\u8F7D\u5165\u5931\u8D25\uFF1A${escapeHtml(error.message)}\u3002\u8BF7\u4FDD\u7559\u672C\u5730\u8349\u7A3F\u5E76\u5BFC\u51FA\u5907\u4EFD\u3002</div>`;
  });
})();
